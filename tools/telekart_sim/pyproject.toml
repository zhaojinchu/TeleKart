[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telekart-sim"
version = "2.0.0"
description = "Protocol-identical TeleKart vehicle simulator: same ports, same packets, same mDNS advert, synthetic H.264."

# >=3.11 rather than the app's >=3.12 on purpose. The simulator has to be
# runnable from the firmware environment too -- that is how the Pi-side network
# stack gets integration-tested without a desktop app in the loop.
requires-python = ">=3.11"

dependencies = [
    # The vehicle model integrates state as arrays so that `--realtime 0` can
    # run a 60-second drive faster than real time for CI.
    "numpy>=1.24",
    # Encodes the synthetic camera feed with the same codec and the same frame
    # framing the car uses. A simulator that hands the app raw RGB would leave
    # the entire decode path untested, which is where the latency bugs live.
    "av>=14,<19",
    # Resolved from the sibling checkout, never from an index -- same story as
    # in pi/pyproject.toml. `make setup-sim` installs it first, by path.
    "telekart-protocol>=2.0,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
telekart-sim = "telekart_sim.__main__:main"

[tool.uv.sources]
telekart-protocol = { path = "../../packages/telekart_protocol", editable = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["telekart_sim", "telekart_sim.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
