[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telekart-ui"
version = "1.0.0"
description = "TeleKart driving station: full-bleed low-latency video, a four-zone HUD, and wheel or WASD control. One window, no configuration."

# Same bounds as the station this replaces, and for the same reasons: the floor
# is what the code is written against, the ceiling is a wheel-availability fact
# about PySide6-Essentials and pygame-ce rather than a guess about the future.
requires-python = ">=3.12,<3.14"

dependencies = [
    # Essentials, not the full PySide6: the full package pulls WebEngine, 3D,
    # Charts and Multimedia -- roughly a gigabyte of Qt this app never loads.
    "PySide6-Essentials==6.11.*",

    # PyAV must stay on a version whose Flags enum still exposes LOW_DELAY and
    # whose CodecContext honours thread_type='NONE'. Frame threading buffers
    # 3-5 frames before emitting anything, which is 100-170 ms of latency and
    # the single most common cause of "H.264 teleop feels laggy".
    "av>=14,<19",

    # pygame-ce, NOT pygame. The two are drop-in compatible at the SDL2 API
    # level, but installing both into one environment breaks imports -- they
    # claim the same `pygame` module name. __main__.preflight() makes that a
    # startup error rather than a mystery.
    "pygame-ce>=2.5.8",

    "platformdirs>=4",

    # Resolved from the sibling checkout, never from an index. `make setup-ui`
    # installs it first, by path.
    "telekart-protocol>=2.0,<3.0",
]

# Deliberately absent, and each for a reason worth writing down:
#
#   zeroconf   -- mDNS browsing existed to populate a discovered-cars table.
#                 There is no table; `telekart.local` resolves through the OS,
#                 which was always the primary path anyway.
#   numpy      -- only ever imported by the diagnostics screen's ring buffers.
#   pyqtgraph  -- likewise, only the diagnostics plots.
#   opencv     -- the track-marker work never shipped.

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4"]

[project.gui-scripts]
telekart-ui = "telekart_ui.__main__:main"

[tool.uv.sources]
telekart-protocol = { path = "../../packages/telekart_protocol", editable = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["telekart_ui", "telekart_ui.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
