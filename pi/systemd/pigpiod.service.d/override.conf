# Drop-in for pigpiod.service. Install to
#   /etc/systemd/system/pigpiod.service.d/override.conf
#
# The empty ExecStart= is mandatory and is not a typo: in a drop-in, a directive
# that may appear more than once APPENDS. Without the reset, this file adds a
# second ExecStart to whatever the packaged unit already had, and systemd
# refuses to start a Type=forking unit with two of them.

[Unit]
Description=pigpio daemon (TeleKart flags)

[Service]
ExecStart=
ExecStart=/usr/local/bin/pigpiod -t 1 -s 5 -l -b 200 -x 0x0BF53060
#                                 |    |    |  |      |
#  clock peripheral: PCM, not PWM -+    |    |  |      |
#      The PWM peripheral is spoken for: ENA (GPIO12) and ENB (GPIO13) ARE the
#      two hardware PWM channels. PCM is already pigpio's default; stating it
#      means an inherited config or a future change of default cannot silently
#      take the motors away. Given that the identical class of failure
#      (dtparam=audio=on) is the number one bring-up problem on this board,
#      being explicit is cheap insurance.
#
#  5 us sample rate ---------------+    |  |      |
#      Sets servo pulse quantisation (5 us of a 600 us span is ~0.2 deg of
#      steering, finer than an HS-311 can resolve) and encoder timestamp
#      granularity (+/-5 us against 455 us between edges at 200 RPM, ~1.1 %
#      velocity noise -- well under the quantisation noise the M/T estimator is
#      already fighting). -s 1 would buy 1.1 % -> 0.2 % of a term that is not the
#      limiting one, for five times the DMA and interrupt load.
#
#  disable the remote socket interface -+  |      |
#      A SAFETY FLAG, not a hardening nicety. By default pigpiod listens on TCP
#      8888 and accepts commands from ANY host with no authentication of any
#      kind: `pigs -h telekart.local hp 12 1000 800000` from anyone on the WiFi
#      spins the motors at 80 % duty. Everything the wire protocol does -- the
#      HMAC, the session token, the strictly increasing sequence number -- is
#      worth precisely nothing with that port open next to it.
#
#  200 ms GPIO sample buffer -------------+      |
#      Default is 120 ms. This is how much GPIO history the daemon holds before
#      it starts dropping samples, and it is what protects encoder counts when
#      the notification thread does not get scheduled promptly. Lost counts
#      corrupt odometry silently, which is the worst way to lose data. Costs
#      200 ms / 5 us = 40 000 samples: hundreds of kilobytes, affordable on
#      512 MB. -b 1000 would not be.
#
#  restrict the daemon to our thirteen pins ----+
#      hex(sum(1 << p for p in (5,6,12,13,16,18,20,21,22,23,24,25,27)))
#      IN1 IN2 ENA ENB ESTOP SERVO IN3 IN4 ENC_R_B ENC_L_A ENC_L_B LED ENC_R_A
#      With the mask in place a typo in a pigs command -- and you will make one,
#      at eleven at night, with the car on the bench -- cannot drive the SD card
#      lines, the camera's I2C, or the ID EEPROM pins. Keep it in sync with
#      docs/wiring.md if the pinout ever changes.

# pigpiod does not shut down cleanly on SIGTERM in all versions, and a daemon
# stuck in shutdown blocks the stop transition of everything ordered after it.
ExecStop=/bin/systemctl kill -s SIGKILL pigpiod.service

Restart=on-failure
RestartSec=2

# The daemon must outlive the firmware's stop transition so ExecStopPost=
# in telekart-control.service still has something to talk to. That ordering
# comes from Requires=/After= on the control unit, not from here.
