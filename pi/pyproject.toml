[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telekart"
version = "2.0.0"
description = "TeleKart vehicle firmware: 100 Hz control loop, telemetry, and camera process for a Raspberry Pi Zero 2 W."
requires-python = ">=3.11"

# Raspberry Pi OS Bookworm ships Python 3.11. Not >=3.12: there is no supported
# path to a newer interpreter on this image that keeps the apt-installed
# picamera2/libcamera bindings working, and rebuilding those from source on a
# 512 MB quad-A53 is a multi-hour exercise in swap thrashing.

dependencies = [
    "PyYAML>=6.0",
    # Resolved from the sibling checkout, never from an index. PEP 508 direct
    # references must be absolute URLs, so a relative path cannot be spelled in
    # this list portably -- see [tool.uv.sources] below for uv, and the ordered
    # install in the repo Makefile (`make setup-pi`) for plain pip.
    "telekart-protocol>=2.0,<3.0",
]

[project.optional-dependencies]
# pigpio is the client library only; the daemon comes from apt and must already
# be running. Kept out of the base dependencies so the whole firmware stays
# importable on a Mac against MockBackend.
rpi = ["pigpio>=1.78"]

# picamera2 is listed for completeness, but on the Pi you want the apt package
# (`sudo apt install -y python3-picamera2`) and a venv created with
# --system-site-packages. Building it from a wheel drags in a libcamera build
# that will not finish on this board.
video = ["picamera2>=0.3.18", "numpy>=1.24"]

dev = ["pytest>=8"]

[project.scripts]
# Two processes by design: the camera must not be able to inject jitter into the
# 100 Hz loop, and the OOM policy must be able to guarantee the kernel kills the
# camera and never the car.
telekart-control = "telekart.app:main"
telekart-video = "telekart_video.app:main"

[tool.uv.sources]
telekart-protocol = { path = "../packages/telekart_protocol", editable = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["telekart", "telekart.*", "telekart_video", "telekart_video.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
