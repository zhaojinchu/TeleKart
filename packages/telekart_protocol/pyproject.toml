[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telekart-protocol"
version = "2.0.0"
description = "Shared wire protocol for TeleKart. Imported unmodified by the Pi firmware, the desktop app, and the simulator."
requires-python = ">=3.11"
dependencies = []

# Deliberately zero dependencies and >=3.11: Raspberry Pi OS Bookworm ships
# Python 3.11, the desktop app runs 3.12. This package must import cleanly on
# both, so no 3.12+ syntax (no PEP 695 generics, no `type` statement).

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["telekart_protocol*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
